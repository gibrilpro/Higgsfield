<style>

:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --bg:#0A0E16; --surface:#121826; --sunk:#0E1420; --ink:#E9EDF5; --muted:#97A1B5; --line:#232C3D;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 56px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.08;text-wrap:balance;margin:0;letter-spacing:-.02em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin-inline:auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.links button{border:0;background:none;padding:8px 10px;border-radius:8px;font-weight:500;color:var(--muted);white-space:nowrap}
.links button[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.badge-proto{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 7px;white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;white-space:nowrap}

.btn.sm{padding:7px 12px;font-size:14px}

/* forms */
form.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-weight:600;font-size:13.5px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:90px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:32px;text-align:center;color:var(--muted)}
.sheet{position:fixed;inset:0;background:color-mix(in srgb,#000 50%,transparent);display:grid;place-items:center;padding:16px;z-index:30}
.sheet>div{background:var(--surface);border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}

.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:20px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:28px;padding-block:32px 28px}.result{grid-template-columns:1fr}.steps3{grid-template-columns:1fr}form.grid2{grid-template-columns:1fr}.big b{font-size:18px}.flow .arrow{transform:rotate(90deg);width:100%;height:22px}.flow .node{flex-basis:100%}}
</style>

function h(tag,attrs={},...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==='class')el.className=v; else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,''); else if(v!==false&&v!=null)el.setAttribute(k,v);
  }
  for(const k of kids.flat()){if(k==null||k===false)continue;el.append(k.nodeType?k:document.createTextNode(String(k)));}
  return el;

let samplePromise=(async()=>{try{return window.claude?await window.claude.use('sample'):null;}catch(e){return null;}})();
function fallbackDiag(text){

  if(t)return {titre:t.titre,resume:t.resume,etapes:t.etapes,outils:t.outils,heures_gagnees_semaine:t.h,prix_min:t.min,prix_max:t.max,delai_jours:t.d,categorie:t.cat,source:'modele'};
  return {titre:'Audit IA et automatisation sur mesure',resume:'Un expert analyse votre façon de travailler pendant un appel de 45 minutes, identifie les tâches à automatiser en priorité et installe la première automatisation.',etapes:['Appel de diagnostic avec un expert','Choix de la tâche qui fait gagner le plus de temps','Installation et formation'],outils:['Make','API Claude'],heures_gagnees_semaine:4,prix_min:300,prix_max:800,delai_jours:7,categorie:'Devis & admin',source:'modele'};

async function runDiag(text,btn,out){
  btn.disabled=true;
  out.replaceChildren(h('div',{class:'thinking'},h('span',{class:'spin','aria-hidden':'true'}),'Analyse de votre besoin…'));
  let res=null;
  const sample=await samplePromise;
  if(sample){
    try{
      const prompt=`Tu es le moteur de diagnostic d'une plateforme française qui met en relation des petites entreprises avec des experts en automatisation et en IA.
Un commerçant ou un indépendant décrit une tâche qui lui fait perdre du temps. Propose UNE solution concrète d'automatisation avec l'IA qu'un expert freelance peut installer.
Réponds uniquement avec un objet JSON de cette forme :
{"titre": string (6 mots max), "resume": string (2 phrases simples, vouvoiement, sans jargon), "etapes": [3 courtes étapes du fonctionnement : déclencheur, ce que fait l'IA, résultat], "outils": [2 à 4 noms d'outils réels], "heures_gagnees_semaine": nombre réaliste, "prix_min": nombre en euros, "prix_max": nombre en euros (installation par un freelance en France, entre 150 et 2000), "delai_jours": nombre, "categorie": une valeur parmi ${JSON.stringify(CATS)}}
Si la demande n'a rien à voir avec une tâche professionnelle, propose un audit IA général.
Description du commerçant : """${text.slice(0,1500)}"""`;
      const j=await sample.json(prompt,{modelTier:'quick'});
      if(j&&typeof j.titre==='string'&&Array.isArray(j.etapes)&&j.etapes.length){
        res={titre:String(j.titre),resume:String(j.resume||''),etapes:j.etapes.slice(0,4).map(String),outils:(Array.isArray(j.outils)?j.outils:[]).slice(0,4).map(String),
          heures_gagnees_semaine:Math.max(1,Math.round(+j.heures_gagnees_semaine||3)),prix_min:Math.max(100,Math.round(+j.prix_min||300)),prix_max:Math.max(150,Math.round(+j.prix_max||700)),
          delai_jours:Math.max(1,Math.round(+j.delai_jours||5)),categorie:CATS.includes(j.categorie)?j.categorie:fallbackDiag(text).categorie,source:'ia'};
        if(res.prix_max<res.prix_min)[res.prix_min,res.prix_max]=[res.prix_max,res.prix_min];
      }
    }catch(e){/* not granted, rate limited, invalid json… → template below */}
  }
  if(!res)res=fallbackDiag(text);
  S.diag={...res,demande:text,at:Date.now()};save();btn.disabled=false;go('result');
}
